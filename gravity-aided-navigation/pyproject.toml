[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gravity-aided-navigation"
version = "0.1.0"
description = "A RelativisticQ-PNT research demonstrator for GPS-denied gravity-aided navigation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Christina Holt"}]
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "streamlit>=1.35"]

[tool.setuptools.packages.find]
where = ["src"]
