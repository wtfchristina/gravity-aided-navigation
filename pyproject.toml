[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gravity-aided-navigation"
version = "0.7.1"
description = "Assured PNT real-data ingestion, geodetic validation, trade-study, SIL/HIL, and integration suite."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Christina Holt"}]
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "streamlit>=1.35", "jupyter>=1.0"]
integration = ["grpcio>=1.60", "protobuf>=5.0"]
geospatial = ["xarray>=2024.1", "netCDF4>=1.6", "rasterio>=1.3", "pyproj>=3.6"]
ros2 = []

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
qpnt = "gravity_nav.cli:main"
