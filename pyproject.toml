[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gravity-aided-navigation"
version = "0.5.0"
description = "An Assured PNT trade-study and SIL/HIL integration suite with streaming, replay, and link impairment analysis."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Christina Holt"}]
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pandas>=2.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "streamlit>=1.35", "jupyter>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
qpnt = "gravity_nav.cli:main"
